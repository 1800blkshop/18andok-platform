name: 18&ok Autonomous Core Execution Loop

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  optimize-business:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Access Codebase Repositories
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize Stable Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Deploy Core Libraries Automatically
        run: |
          python -m pip install --upgrade pip
          pip install yfinance GitPython

      - name: Launch Autonomous Profit Optimization Loop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python autonomous_agent.py
